[build]
  command = "npm run build"
  publish = ".next"

# Migracije se primenjuju samo pri produkcijskom deploy-u. Preview deploy-evi
# dele iste env varijable, pa bi ih inace svaki PR primenio na produkcijsku
# bazu, uz rizik od trke kad se vise deploy-eva vrti paralelno.
[context.production]
  command = "npm run build:production"

[functions]
  directory = "netlify/functions"
