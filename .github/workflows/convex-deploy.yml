name: Deploy Convex

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Preview (PR)
        if: github.event_name == 'pull_request'
        run: npx convex deploy --preview-create "${{ github.head_ref }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Set Preview Environment Variables
        if: github.event_name == 'pull_request'
        run: |
          # SITE_URL must be the Coolify preview URL (frontend), not Convex site URL
          # Coolify format: {{pr_number}}.dragana-stomatolog.hektor-tech.com
          npx convex env set SITE_URL "https://${{ github.event.pull_request.number }}.dragana-stomatolog.hektor-tech.com" --preview-name "${{ github.head_ref }}"
          npx convex env set BETTER_AUTH_SECRET "${{ secrets.BETTER_AUTH_SECRET }}" --preview-name "${{ github.head_ref }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Deploy to Production (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Set Production Environment Variables
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          npx convex env set SITE_URL "https://dragana-stomatolog.hektor-tech.com"
          npx convex env set BETTER_AUTH_SECRET "${{ secrets.BETTER_AUTH_SECRET }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
